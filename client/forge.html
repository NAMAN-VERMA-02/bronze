<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bronze — Forge (legacy)</title>
  <style>
    :root {
      --bg: #16120d;
      --panel: #221c14;
      --panel2: #2b2318;
      --ink: #e8e0cf;
      --dim: #a89a7e;
      --brass: #c9a227;
      --line: #3d3325;
      --danger: #b23a48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }
    .hidden { display: none !important; }
    button, a.btn {
      background: var(--panel2);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-block;
    }
    button:hover:not(:disabled), a.btn:hover { border-color: var(--brass); color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    input {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--brass); }

    .view { height: 100vh; display: flex; flex-direction: column; }

    #menu { align-items: center; justify-content: center; gap: 18px; }
    #menu h1 { font-family: Georgia, serif; color: var(--brass); letter-spacing: 2px; font-size: 34px; }
    #menu .sub { color: var(--dim); margin-top: -10px; }
    #menu .row { display: flex; gap: 10px; align-items: center; }

    #lobby { align-items: center; justify-content: center; gap: 14px; }
    #lobbyCode { font-family: Georgia, serif; font-size: 52px; letter-spacing: 12px; color: var(--brass); }
    #seats { list-style: none; text-align: center; color: var(--dim); }
    #seats li { padding: 4px; }

    header#status {
      display: flex; gap: 22px; align-items: baseline;
      padding: 10px 16px; background: var(--panel);
      border-bottom: 1px solid var(--line);
      white-space: nowrap; overflow-x: auto;
    }
    header#status .era { font-family: Georgia, serif; color: var(--brass); font-size: 17px; }
    header#status .muted { color: var(--dim); }
    #leaveBtn { margin-left: auto; }

    #main { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
    #boardHost { position: relative; min-width: 0; min-height: 0; }
    #boardHost canvas { display: block; width: 100%; height: 100%; }

    #side {
      display: flex; flex-direction: column; gap: 10px;
      padding: 10px; overflow-y: auto; background: var(--panel);
      border-left: 1px solid var(--line);
    }
    section.box {
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px;
    }
    section.box h3 {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--dim); margin-bottom: 8px;
    }
    #playersBox table { width: 100%; border-collapse: collapse; }
    #playersBox td { padding: 3px 6px; }
    #playersBox tr.turn td { color: var(--brass); }
    #playersBox td.num { text-align: right; font-variant-numeric: tabular-nums; }

    #actions .group { margin-bottom: 12px; }
    #actions .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #35291a; border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 10px; cursor: pointer; font-size: 13px;
    }
    .chip.sel { border-color: var(--brass); color: var(--brass); }
    .targetRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0; }
    .targetRow .loc { color: var(--dim); min-width: 150px; }
    .lvlBtn { padding: 2px 8px; font-size: 12px; }
    #logBox ol { list-style: none; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
    #logBox li { padding: 2px 0; color: var(--dim); border-bottom: 1px dotted #00000030; }
    #logBox li:last-child { color: var(--ink); }
    label.dev { display: block; padding: 3px 0; cursor: pointer; }

    footer#handBar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: var(--panel); border-top: 1px solid var(--line);
      padding: 10px 16px; min-height: 54px;
    }
    footer#handBar .cardChip {
      background: linear-gradient(180deg, #3a2f1e, #2c2417);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 8px 12px; cursor: pointer; user-select: none;
      box-shadow: 0 2px 4px #00000060;
    }
    footer#handBar .cardChip.sel { outline: 2px solid var(--brass); transform: translateY(-4px); }

    #overlay {
      position: fixed; inset: 0; background: #000000c9;
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    #overlay .sheet {
      background: var(--panel); border: 1px solid var(--brass);
      border-radius: 12px; padding: 28px 40px; text-align: center; min-width: 340px;
    }
    #overlay h2 { font-family: Georgia, serif; color: var(--brass); margin-bottom: 14px; }
    #overlay table { margin: 0 auto 16px; border-collapse: collapse; }
    #overlay td, #overlay th { padding: 5px 14px; text-align: left; }

    #toast {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff; padding: 9px 18px;
      border-radius: 8px; z-index: 99; box-shadow: 0 4px 14px #00000080;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div id="menu" class="view">
    <h1>BRONZE</h1>
    <div class="sub">the digital forge · west midlands 1770</div>
    <div class="row">
      <input id="nameInput" placeholder="Your name" maxlength="24" size="18" />
      <input id="codeInput" placeholder="CODE" maxlength="4" size="6"
             style="text-transform: uppercase; letter-spacing: 4px;" />
    </div>
    <div class="row">
      <button id="createBtn">Forge a New Table</button>
      <button id="joinBtn">Join Table</button>
    </div>
    <div class="row">
      <button id="rejoinBtn" class="hidden"></button>
    </div>
    <div class="row">
      <a class="btn" href="/kinetic.html">Enter the Kinetic Vision</a>
    </div>
  </div>

  <div id="lobby" class="view hidden">
    <div class="sub">table code</div>
    <div id="lobbyCode"></div>
    <ul id="seats"></ul>
    <button id="startBtn">Ring the Starting Bell</button>
    <div class="sub">waiting for at least two industrialists…</div>
  </div>

  <div id="game" class="view hidden">
    <header id="status"></header>
    <div id="main">
      <div id="boardHost"></div>
      <aside id="side">
        <section class="box" id="playersBox"><h3>Industrialists</h3><div id="playersDiv"></div></section>
        <section class="box" id="actions"><h3>Actions</h3><div id="actionsDiv"></div></section>
        <section class="box" id="logBox"><h3>Ledger</h3><ol id="logOl"></ol></section>
      </aside>
    </div>
    <footer id="handBar"></footer>
  </div>

  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
