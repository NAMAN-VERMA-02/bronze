<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BRONZE: The Aurel Valley</title>
  <meta name="description" content="A free 3D strategy game for 1-4 players. Mine, smelt and forge bronze, claim rivers and roads, and outbid rival lords in a living market. Play against AI or friends in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b090c; --stone: #1b1716; --stone2: #262020; --stone3: #322a26;
      --edge: #6b5634; --gold: #d8b25a; --gold2: #f3d98d; --ink: #efe3c6; --dim: #b9a57e;
      --red: #b9483c; --green: #7fae5a; --blue: #6fb2d4;
      --coal: #3a3a40; --copper: #c0703c; --tin: #b9c4cf; --bronze: #d29a3e; --machine: #9fb4c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif; font-size: 16px; font-weight: 600; }
    button { font-family: inherit; font-weight: 700; color: inherit; }
    .cinzel { font-family: Cinzel, Georgia, serif; letter-spacing: .08em; }
    #world { position: fixed; inset: 0; }
    .hidden { display: none !important; }
    .panel { background: linear-gradient(180deg, rgba(50,42,38,.94), rgba(27,23,22,.94));
      border: 1px solid var(--edge); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,230,170,.08); }
    .btn { cursor: pointer; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 16px;
      background: linear-gradient(180deg, #4a3c2c, #2b221b); font-family: Cinzel, serif; letter-spacing: .12em;
      font-size: 13px; transition: transform .1s, border-color .15s, color .15s, box-shadow .15s; }
    .btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold2); box-shadow: 0 0 18px rgba(216,178,90,.25); transform: translateY(-1px); }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn.primary { background: linear-gradient(180deg, #8a6a2e, #5b4219); border-color: var(--gold); color: #fff6dc; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 99px; font-size: 13px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
    .g-coal { background: var(--coal); } .g-copper { background: var(--copper); } .g-tin { background: var(--tin); }
    .g-bronze { background: var(--bronze); } .g-machine { background: var(--machine); }

    /* ---------------------------------------------------- menus */
    #menu { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(90% 70% at 50% 60%, rgba(20,15,12,.35), rgba(8,6,8,.92)); }
    #menu .card { width: min(520px, 92vw); padding: 40px 44px 32px; text-align: center; }
    #menu h1 { font-family: Cinzel, serif; font-weight: 900; font-size: 54px; letter-spacing: .22em; color: var(--gold);
      text-shadow: 0 0 40px rgba(216,178,90,.35), 0 3px 0 #000; }
    #menu .sub { font-family: Cinzel, serif; letter-spacing: .4em; font-size: 13px; color: var(--dim); margin-top: 6px; }
    #menu .lede { margin: 18px 0 22px; color: var(--ink); font-size: 18px; line-height: 1.35; }
    #menu .stack { display: flex; flex-direction: column; gap: 10px; }
    #menu .row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
    #menu input, #menu select { font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: #120f0e;
      border: 1px solid var(--edge); border-radius: 7px; padding: 9px 12px; }
    #menu input { width: 100%; }
    #menu .code { font-family: Cinzel, serif; font-size: 40px; letter-spacing: .35em; color: var(--gold2); margin: 8px 0; }
    #menu .seats { text-align: left; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
    #menu .seat { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 7px; background: rgba(0,0,0,.3); }
    #menu .back { margin-top: 14px; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 15px; }
    #menu .note { color: var(--dim); font-size: 14px; margin-top: 10px; }
    #menu .err { color: #ff9a8a; min-height: 20px; margin-top: 8px; }

    /* ---------------------------------------------------- HUD */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #players { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; width: 210px; }
    .plate { padding: 7px 10px 8px; border-left: 5px solid var(--pc); transition: transform .3s, box-shadow .3s; }
    .plate.turn { transform: translateX(6px); box-shadow: 0 0 24px color-mix(in srgb, var(--pc) 60%, transparent), 0 10px 30px rgba(0,0,0,.6); border-color: var(--gold); }
    .plate .nm { font-family: Cinzel, serif; font-size: 14px; display: flex; justify-content: space-between; }
    .plate .st { display: flex; gap: 10px; margin-top: 3px; font-size: 15px; color: var(--dim); }
    .plate .st b { color: var(--ink); }
    .plate .tag { font-size: 11px; color: var(--dim); font-family: Cinzel, serif; }

    #track { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(480px, 36vw); padding: 8px 14px 10px; }
    #track .hd { display: flex; justify-content: space-between; font-family: Cinzel, serif; font-size: 13px; color: var(--gold); letter-spacing: .14em; }
    #track .bar { position: relative; height: 26px; margin-top: 6px; border-radius: 6px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px calc(100% / 18)), rgba(0,0,0,.35); }
    #track .tick { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    #track .tick span { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--dim); white-space: nowrap; }
    #track .tok { position: absolute; top: 3px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
      background: var(--pc); border: 2px solid #f5e6c4; box-shadow: 0 2px 6px rgba(0,0,0,.6); transition: left .5s cubic-bezier(.3,1.4,.5,1), top .3s; }
    #track .tok.turn { box-shadow: 0 0 0 3px rgba(216,178,90,.6), 0 0 14px var(--gold); }

    #market { position: absolute; top: 12px; right: 12px; width: 230px; padding: 8px 12px 10px; }
    #market h3, #contracts h3, #me h3 { font-family: Cinzel, serif; font-size: 12px; letter-spacing: .2em; color: var(--gold); margin-bottom: 6px; }
    .price { display: grid; grid-template-columns: 16px 1fr auto 70px; gap: 6px; align-items: center; font-size: 15px; padding: 2px 0; }
    .ladder { display: flex; gap: 2px; }
    .ladder i { width: 7px; height: 10px; border-radius: 2px; background: rgba(255,255,255,.08); }
    .ladder i.on { background: var(--gold); }
    #event { margin-top: 8px; padding: 6px 8px; border-radius: 7px; background: rgba(0,0,0,.35); font-size: 14px; line-height: 1.25; }
    #event b { font-family: Cinzel, serif; color: var(--gold2); font-size: 12px; letter-spacing: .1em; display: block; }

    #contracts { position: absolute; right: 12px; top: 268px; width: 230px; padding: 8px 10px 10px; max-height: calc(100vh - 380px); overflow: auto; }
    .ct { padding: 7px 9px; border-radius: 8px; margin-bottom: 6px; background: linear-gradient(180deg, #e9dcbc, #cdbb92); color: #2b2013;
      box-shadow: 0 4px 10px rgba(0,0,0,.45); cursor: pointer; transition: transform .15s; position: relative; }
    .ct:hover { transform: translateX(-4px) rotate(-.6deg); }
    .ct .to { font-family: Cinzel, serif; font-size: 13px; font-weight: 700; }
    .ct .wants { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
    .ct .wants .chip { background: rgba(0,0,0,.12); color: #2b2013; }
    .ct .rw { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .ct .go { padding: 4px 9px; font-size: 11px; }
    .ct.age1 { border-left: 4px solid #2f6f86; }
    .ct.ready { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(216,178,90,.6); }

    #me { position: absolute; left: 12px; bottom: 12px; width: 250px; padding: 8px 12px 10px; font-size: 15px; }
    #me .row { display: flex; justify-content: space-between; padding: 1px 0; }
    #me .goal { font-size: 14px; color: var(--dim); }
    #me .goal b { color: var(--ink); font-family: Cinzel, serif; font-size: 12px; }

    #actions { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; }
    .act { width: 92px; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .act .ic { font-size: 24px; line-height: 1; filter: drop-shadow(0 2px 2px #000); }
    .act .lb { font-size: 12px; }
    .act .tm { font-size: 11px; color: var(--dim); font-family: Cormorant Garamond, serif; letter-spacing: 0; }
    .act.on { border-color: var(--gold); color: var(--gold2); box-shadow: 0 0 20px rgba(216,178,90,.4); }
    .act .key { position: absolute; margin-top: -14px; margin-left: 60px; font-size: 10px; color: var(--dim); }

    #log { position: absolute; right: 12px; bottom: 12px; width: 300px; padding: 8px 10px; font-size: 14px; max-height: 120px; overflow: hidden; }
    #log div { padding: 1px 0; color: var(--dim); }
    #log div:last-child { color: var(--ink); }

    #prompt { position: absolute; bottom: 112px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 17px; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
    #picker { position: absolute; left: 50%; bottom: 160px; transform: translateX(-50%); padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
    #picker .opt { min-width: 140px; text-align: left; padding: 9px 12px; }
    #picker .opt small { display: block; font-family: Cormorant Garamond, serif; letter-spacing: 0; color: var(--dim); font-size: 14px; margin-top: 2px; }
    #tip { position: absolute; pointer-events: none; padding: 6px 10px; font-size: 14px; max-width: 260px; z-index: 20; }

    #topright { position: absolute; top: 12px; left: 234px; display: flex; gap: 6px; }
    #topright .btn { padding: 7px 10px; font-size: 11px; }

    #banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 25; text-align: center; pointer-events: none; }
    #banner .in { display: inline-block; padding: 18px 60px; background: linear-gradient(90deg, transparent, rgba(12,9,8,.92) 20%, rgba(12,9,8,.92) 80%, transparent); }
    #banner .big { font-family: Cinzel, serif; font-weight: 900; font-size: 46px; letter-spacing: .2em; color: var(--gold); text-shadow: 0 0 30px rgba(216,178,90,.5); }
    #banner .small { font-size: 20px; color: var(--ink); margin-top: 4px; }

    #results { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(6,5,6,.75); }
    #results .card { padding: 30px 36px; min-width: 520px; text-align: center; }
    #results h2 { font-family: Cinzel, serif; font-size: 34px; color: var(--gold); letter-spacing: .15em; }
    #results table { margin: 16px auto; border-collapse: collapse; font-size: 16px; }
    #results td { padding: 4px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.07); }
    #results .w td { color: var(--gold2); }

    #help { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; background: rgba(6,5,6,.8); }
    #help .card { width: min(760px, 94vw); max-height: 88vh; overflow: auto; padding: 26px 30px; font-size: 17px; line-height: 1.4; }
    #help h2 { font-family: Cinzel, serif; color: var(--gold); letter-spacing: .14em; margin-bottom: 8px; }
    #help h4 { font-family: Cinzel, serif; color: var(--gold2); margin: 12px 0 4px; font-size: 14px; letter-spacing: .1em; }
    #help li { margin-left: 18px; }

    /* ---------------------------------------------------- icons */
    .ico { width: 1.1em; height: 1.1em; vertical-align: -0.18em; flex: none; }
    .ico.small { width: .95em; height: .95em; }
    .amt { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .amt .ico.mark { color: var(--gold2); }
    .amt .ico.glory { color: #f0c96a; }
    .amt .ico.time { color: var(--dim); }
    .ct .amt .ico.mark, .ct .amt .ico.glory { color: #7a5214; }
    .btn .ico { width: 15px; height: 15px; margin-right: 4px; }
    .btn.icon { padding: 7px 9px; }
    .btn.icon .ico { margin: 0; width: 17px; height: 17px; }
    .act .ic .ico { width: 30px; height: 30px; margin: 0; color: var(--gold); stroke-width: 1.4; }
    .act:disabled .ic .ico { color: var(--dim); }
    .act .tm .ico { width: 12px; height: 12px; margin: 0; }
    .stock { display: inline-flex; gap: 10px; }
    .stock .ico { color: var(--gold); }
    .ct .to .ico { margin-right: 4px; color: #2f5d72; }
    #track .tick span .ico { margin-right: 2px; }
    .plate .st { align-items: center; }

    /* ---------------------------------------------------- previews, feed, seals */
    .pv { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.1); }
    .pv .pos { color: #b9e08a; } .pv .neg { color: #f0a08a; }
    #feed { position: fixed; right: 254px; top: 64px; z-index: 12; display: flex; flex-direction: column; gap: 6px; width: 300px; pointer-events: none; }
    .feedcard { padding: 8px 12px 9px; border-radius: 9px; border-left: 5px solid var(--pc);
      background: linear-gradient(180deg, rgba(50,42,38,.96), rgba(27,23,22,.96)); box-shadow: 0 8px 22px rgba(0,0,0,.6);
      font-size: 15px; line-height: 1.25; animation: feedin .35s cubic-bezier(.2,1.3,.4,1); transition: opacity .4s, transform .4s; }
    .feedcard b { display: block; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .12em; color: var(--pc); filter: brightness(1.5); }
    .feedcard.out { opacity: 0; transform: translateX(30px); }
    @keyframes feedin { from { opacity: 0; transform: translateX(40px) scale(.96); } to { opacity: 1; transform: none; } }
    .ct { padding-right: 46px; }
    .seal { position: absolute; right: 8px; top: 50%; transform: translateY(-50%) rotate(-8deg); width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-family: Cinzel, serif; font-weight: 900; font-size: 15px; color: #fbe3c8;
      background: radial-gradient(circle at 35% 30%, #c4483a, #8d2419 60%, #5e140d); box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.35);
      border: 2px dashed rgba(255,210,180,.25); }
    .ct .go { position: relative; z-index: 1; }

    /* ---------------------------------------------------- mood */
    #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, transparent 50%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.8) 100%); }
    #grain { position: fixed; inset: -50%; z-index: 6; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 1.2s steps(6) infinite; }
    @keyframes grain { 0% { transform: translate(0,0); } 33% { transform: translate(-3%,2%); } 66% { transform: translate(2%,-3%); } 100% { transform: translate(0,0); } }
    @media (prefers-reduced-motion: reduce) { #grain { animation: none; } }

    @media (max-width: 1100px) { #log { display: none; } #me { width: 210px; } .act { width: 74px; } }
  </style>
</head>
<body>
  <div id="world"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="hud" class="hidden"></div>
  <div id="menu"></div>
  <div id="banner" class="hidden"><div class="in"><div class="big"></div><div class="small"></div></div></div>
  <script type="module" src="/src/valley/main.ts"></script>
</body>
</html>
